# Apache virtual host for the Origin Driving School Management System.
# Listens on the platform-provided port (substituted at startup by the
# entrypoint) and serves the application from the origin_driving_school/ folder.

<VirtualHost *:${PORT}>
    DocumentRoot ${APP_DOCROOT}

    <Directory ${APP_DOCROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
